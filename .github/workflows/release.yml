name: Multi-OS Build

on:
  push:
    tags:
      - 'v*'

jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # macOS/Linux を配布対象に戻す場合は上の行を差し替える:
        #   os: [ubuntu-latest, windows-latest, macos-15]
        # ⚠️ macos-latest は使わない。2026年6月に macos-26 へ切り替わり、Xcode 26.5 の
        #    actool の回帰バグ（Apple FB20183399）で generate:icons の
        #    `-macassetdir darwin` がクラッシュする。macos-15 にピン留めすること。
    if: |
      contains(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-') &&
      !contains(github.ref, '+')
    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Load variables
        shell: bash
        run: cat .github/variables.env >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Get Go Env
        shell: bash
        run: |
          echo "GOOS=$(go env GOOS)" >> $GITHUB_ENV
          echo "GOARCH=$(go env GOARCH)" >> $GITHUB_ENV
          echo "APP_NAME=brender" >> $GITHUB_ENV
          echo "VERSION=$(cat _cmd/brender/version | xargs)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Display version
        run: |
          go version
          go env GOOS GOARCH
          node -v
          npm -v

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Wails doctor
        run: |
          wails3 version
          wails3 doctor

      - name: Check Wails version consistency
        run: go run _cmd/wails3_check.go

      - name: Build or Package
        working-directory: ./_cmd/brender
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # universal (arm64 + amd64) の .app を生成する。
            # `wails3 package` はランナーのネイティブアーキのみのため Intel Mac で動かない。
            # arm64 専用でよくなったら `wails3 task darwin:package` に変えればよい。
            # このタスクの最後に codesign:adhoc（`codesign --sign -`）が走る。
            # Developer ID を用意したら darwin:sign:notarize へ差し替える
            # （build/darwin/Taskfile.yml の SIGN_IDENTITY / KEYCHAIN_PROFILE を設定）。
            wails3 task darwin:package:universal
          else
            wails3 build
          fi

      - name: Archive Build Results
        shell: bash
        run: |
          export GOOS=$(go env GOOS)
          export GOARCH=$(go env GOARCH)
          cd ./_cmd/brender/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            ZIP_NAME="brender-${VERSION}_${GOOS}_${GOARCH}.zip"
            7z a ../../../${ZIP_NAME} ./*
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # universal ビルドなのでアーキ名はランナーの GOARCH ではなく universal 固定
            ZIP_NAME="brender-${VERSION}_darwin_universal.zip"
            # 配布物は .app のみ（bin/ には .app 内へコピーされた生バイナリも残っている）。
            # zip -r はシンボリックリンクを実体化し拡張属性を落とすためコード署名が壊れる。
            # .app の圧縮は Apple 推奨の ditto を使う。
            ditto -c -k --sequesterRsrc --keepParent brender.app ../../../${ZIP_NAME}
          else
            ZIP_NAME="brender-${VERSION}_${GOOS}_${GOARCH}.zip"
            zip -r ../../../${ZIP_NAME} ./*
          fi
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-asset
          path: ${{ env.ZIP_PATH }}

  release:

    needs: build

    if: |
      success() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-') &&
      !contains(github.ref, '+')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./all-zips
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        files: ./all-zips/*.zip
        generate_release_notes: true
        draft: true
        prerelease: false
